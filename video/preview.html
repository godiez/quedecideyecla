<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Vista previa</title>
<!-- Image shown when a link to the site is shared (video/preview.py): the closing card of the video, 1200×630.
     WhatsApp shows it about 300px wide, a quarter: the smallest text here is 30px so it is still ~8px there. -->
<style>
:root {
  --paper: #f6f1e7; --accent: #8b2a1d;
  --serif: Georgia, "Times New Roman", serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body {
  background: var(--accent); color: var(--paper); padding: 0 110px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
}
.t { font: 700 104px/1.02 var(--serif); letter-spacing: -0.015em; text-wrap: balance; }
/* text-indent equal to the tracking: the space after the last letter would push the town's name off centre. */
.s { margin-top: 22px; font: 600 30px/1 var(--sans); letter-spacing: .16em; text-indent: .16em; text-transform: uppercase; color: rgba(246, 241, 231, .78); }
.rule { width: 96px; height: 2px; margin: 38px 0 34px; background: rgba(246, 241, 231, .5); }
.by { max-width: 820px; font: 400 36px/1.3 var(--sans); color: rgba(246, 241, 231, .92); text-wrap: balance; }
</style>
</head>
<body>
<div class="t"></div>
<div class="s"></div>
<div class="rule"></div>
<div class="by">Web no oficial, construida a partir de las actas del Ayuntamiento</div>
<script>
  window.setBrand = function (name, town) {
    document.querySelector(".t").textContent = name;
    document.querySelector(".s").textContent = town;
  };
</script>
</body>
</html>
