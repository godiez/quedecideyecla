<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Vídeo de presentación</title>
<!-- Stage of the presentation video (video/record.py): 360×640 CSS px rendered at 3× (1080×1920). The site is
     shown inside a drawn phone; record.py moves everything frame by frame through window.setState(). -->
<style>
:root {
  --paper: #f6f1e7; --ink: #1b1b1b; --accent: #8b2a1d; --gray: #6b5f4a;
  --serif: Georgia, "Times New Roman", serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 360px; height: 640px; overflow: hidden; background: var(--paper); }
/* Warm light from below, the colour of old paper in the sun, so the phone does not float on a flat page. */
.glow {
  position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(80% 30% at 50% 104%, rgba(205, 128, 64, .42), rgba(205, 128, 64, 0) 72%),
    radial-gradient(45% 22% at 8% 100%, rgba(139, 42, 29, .16), rgba(139, 42, 29, 0) 70%),
    radial-gradient(45% 22% at 92% 100%, rgba(139, 42, 29, .16), rgba(139, 42, 29, 0) 70%);
}
.text { position: absolute; left: 24px; right: 24px; text-align: center; color: var(--ink); will-change: filter, opacity, transform; }
.brand { top: 236px; }
.brand .t { display: block; font: 700 34px/1.08 var(--serif); letter-spacing: -0.01em; text-wrap: balance; }
/* text-indent equal to the tracking: the space after the last letter would push the town's name off centre. */
.brand .s { display: block; margin-top: 10px; font: 600 12px/1 var(--sans); letter-spacing: .16em; text-indent: .16em; text-transform: uppercase; color: var(--gray); }
.caption { top: 62px; font: 700 26px/1.14 var(--serif); letter-spacing: -0.005em; text-wrap: balance; }

#phone { position: absolute; left: 0; top: 0; width: 414px; height: 868px; transform-origin: 0 0; }
.body {
  position: absolute; inset: 0; border-radius: 66px; background: #151515;
  box-shadow: 0 0 0 1.5px #3b3936, 0 28px 50px -10px rgba(70, 40, 15, .35), 0 8px 18px rgba(70, 40, 15, .18);
}
.screen { position: absolute; left: 12px; top: 12px; width: 390px; height: 844px; border-radius: 55px; overflow: hidden; background: var(--paper); }
.status { position: absolute; left: 0; top: 0; width: 390px; height: 47px; background: var(--paper); color: var(--ink); }
.status .time { position: absolute; left: 50px; top: 15px; font: 600 17px/1 var(--sans); letter-spacing: -0.01em; }
.status svg { position: absolute; top: 17px; }
.island { position: absolute; left: 132px; top: 11px; width: 126px; height: 37px; border-radius: 19px; background: #000; }
#view { position: absolute; left: 0; top: 47px; width: 390px; height: 797px; background: var(--paper); }
#site { width: 390px; height: 797px; border: 0; display: block; }
.tap { position: absolute; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: rgba(27, 27, 27, .3); box-shadow: 0 0 0 2px rgba(246, 241, 231, .8); opacity: 0; }

.end {
  position: absolute; inset: 0; background: var(--accent); color: var(--paper);
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 28px;
  transform: translateY(100%);
}
/* Its children are narrower than the title (the rule, the sentence): centred as boxes, not only their text. */
.end-in { display: flex; flex-direction: column; align-items: center; }
.end .t { font: 700 36px/1.08 var(--serif); letter-spacing: -0.01em; text-wrap: balance; }
.end .s { margin-top: 12px; font: 600 12px/1 var(--sans); letter-spacing: .16em; text-indent: .16em; text-transform: uppercase; color: rgba(246, 241, 231, .78); }
.end .rule { width: 56px; height: 1px; margin: 26px 0; background: rgba(246, 241, 231, .5); }
.end .by { font: 400 16px/1.45 var(--sans); color: rgba(246, 241, 231, .9); max-width: 250px; }
.end .url { margin-top: 18px; font: 600 15px/1.3 var(--sans); color: var(--paper); white-space: nowrap; }
</style>
</head>
<body>
<div class="glow"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="mblur" x="-5%" y="-30%" width="110%" height="160%"><feGaussianBlur id="mblur-g" stdDeviation="0 0"/></filter>
  <filter id="end-blur" x="-5%" y="-30%" width="110%" height="160%"><feGaussianBlur id="end-blur-g" stdDeviation="0 0"/></filter>
</svg>

<div id="phone">
  <div class="body"></div>
  <div class="screen">
    <div id="view"><iframe id="site" title="Web"></iframe></div>
    <div class="tap" id="tap"></div>
    <div class="status">
      <span class="time">9:41</span>
      <svg style="left:286px" width="18" height="12" viewBox="0 0 18 12" aria-hidden="true"><g fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></g></svg>
      <svg style="left:310px" width="16" height="12" viewBox="0 0 16 12" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M1.3 4.3a10 10 0 0 1 13.4 0"/><path d="M3.9 7.1a6.2 6.2 0 0 1 8.2 0"/></g><circle cx="8" cy="10.2" r="1.5" fill="currentColor"/></svg>
      <svg style="left:332px" width="27" height="13" viewBox="0 0 27 13" aria-hidden="true"><rect x=".6" y=".6" width="23" height="11.8" rx="3.6" fill="none" stroke="currentColor" stroke-opacity=".4" stroke-width="1.2"/><rect x="2.4" y="2.4" width="19.4" height="8.2" rx="2.2" fill="currentColor"/><path d="M25.3 4.4v4.2a2.2 2.2 0 0 0 0-4.2z" fill="currentColor" fill-opacity=".45"/></svg>
    </div>
    <div class="island"></div>
  </div>
</div>

<div class="text brand" id="brand"><span class="t"></span><span class="s"></span></div>
<div id="captions"></div>

<div class="end" id="end">
  <div class="end-in" id="end-in">
    <div class="t"></div>
    <div class="s"></div>
    <div class="rule"></div>
    <div class="by">Construida a partir de las actas del Ayuntamiento</div>
    <div class="url" hidden></div>
  </div>
</div>

<script>
// Nothing here animates by itself, so each screenshot is exactly the frame record.py asked for.
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  function fx(el, s) {
    el.style.opacity = s.o;
    el.style.filter = s.blur > 0.05 ? "blur(" + s.blur + "px)" : "none";
    el.style.transform = "translateY(" + (s.y || 0) + "px)";
  }
  window.setBrand = function (name, town, url) {
    document.querySelectorAll("#brand .t, #end .t").forEach(function (el) { el.textContent = name; });
    document.querySelectorAll("#brand .s, #end .s").forEach(function (el) { el.textContent = town; });
    var u = document.querySelector("#end .url");
    u.textContent = url;
    u.hidden = !url;
  };
  window.setCaptions = function (texts) {
    $("captions").innerHTML = texts.map(function (t, i) {
      return '<div class="text caption" id="cap' + i + '" style="opacity:0"></div>';
    }).join("");
    texts.forEach(function (t, i) { $("cap" + i).textContent = t; });
  };
  window.setState = function (s) {
    fx($("brand"), s.brand);
    document.querySelectorAll(".caption").forEach(function (el, i) {
      var c = s.captions[i];
      if (c) fx(el, c); else el.style.opacity = 0;
    });
    var p = $("phone");
    p.style.transform = "translate(" + s.phone.x + "px," + s.phone.y + "px) scale(" + s.phone.scale + ")";
    $("mblur-g").setAttribute("stdDeviation", "0 " + s.phone.mblur);
    p.style.filter = s.phone.mblur > 0.05 ? "url(#mblur)" : "none";
    var v = $("view");
    v.style.opacity = s.screen.o;
    v.style.filter = s.screen.blur > 0.05 ? "blur(" + s.screen.blur + "px)" : "none";
    var t = $("tap");
    if (s.tap) {
      t.style.left = s.tap.x + "px"; t.style.top = (47 + s.tap.y) + "px";
      t.style.opacity = s.tap.o; t.style.transform = "scale(" + s.tap.scale + ")";
    } else { t.style.opacity = 0; }
    var e = $("end");
    e.style.transform = "translateY(" + (1 - s.end.p) * 100 + "%)";
    $("end-blur-g").setAttribute("stdDeviation", "0 " + s.end.mblur);
    e.style.filter = s.end.mblur > 0.05 ? "url(#end-blur)" : "none";
    fx($("end-in"), s.end.text);
  };
})();
</script>
</body>
</html>
